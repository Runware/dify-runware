model: google-gemini-3-flash
label:
  en_US: Google Gemini 3 Flash
  zh_Hans: Google Gemini 3 Flash
model_type: llm
features:
- agent-thought
- tool-call
- multi-tool-call
- stream-tool-call
- structured-output
- vision
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
- name: temperature
  use_template: temperature
  type: float
- name: top_p
  use_template: top_p
  type: float
- name: frequency_penalty
  use_template: frequency_penalty
  type: float
- name: presence_penalty
  use_template: presence_penalty
  type: float
- name: max_tokens
  use_template: max_tokens
  type: int
  default: 1024
  min: 1
  max: 65536
- name: response_format
  label:
    en_US: Response Format
  type: string
  required: false
  options:
  - text
  - json_object
pricing:
  input: '0.5'
  output: '3'
  unit: '0.000001'
  currency: USD
