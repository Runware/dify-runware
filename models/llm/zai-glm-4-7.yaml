model: zai-glm-4-7
label:
  en_US: GLM-4.7
  zh_Hans: GLM-4.7
model_type: llm
features:
- agent-thought
- tool-call
- multi-tool-call
- stream-tool-call
- structured-output
model_properties:
  mode: chat
  context_size: 200000
parameter_rules:
- name: temperature
  use_template: temperature
  type: float
- name: top_p
  use_template: top_p
  type: float
- name: frequency_penalty
  use_template: frequency_penalty
  type: float
- name: presence_penalty
  use_template: presence_penalty
  type: float
- name: max_tokens
  use_template: max_tokens
  type: int
  default: 1024
  min: 1
  max: 131072
- name: response_format
  label:
    en_US: Response Format
  type: string
  required: false
  options:
  - text
  - json_object
pricing:
  input: '0.34'
  output: '1.487'
  unit: '0.000001'
  currency: USD
